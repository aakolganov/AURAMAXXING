# Scenario 2 -- CPU-only MACE, one model per node.
#
# Same Si/Al (Siral-70) slab as siral70.yaml, but the saturation/finalize potential is a
# MACE model running on CPU (device: cpu). On HPC this is meant to run as a job array with
# ONE slab per node: each array task loads the model once and lets MACE use every core of
# the node per evaluation, so parallelism comes from the array, not an in-node pool.
#
#   # one node's share of an N-way sharded sweep (CORES = cores per node):
#   python -m runner examples/config/siral70_mace_cpu.yaml \
#       --num-shards N --shard $SLURM_ARRAY_TASK_ID --workers 1 --threads $CORES
#   # after all tasks finish, build the single pooled report:
#   python -m runner examples/config/siral70_mace_cpu.yaml --pool-only
#
# See examples/slurm/generate_array.sbatch (scenario 2 block) for the full template.

structure:
  cell: [22.0, 22.0, 40.0]

composition:
  target_ratios: {Si: 4, Al: 2, O: 11}   # 2 Si : 1 Al, charge-neutral oxide
  target_number_atoms: 440

limits:
  bottom: {type: flat,    z: 12.0}
  top:    {type: fourier, z_av: 24.0, alpha: 1.0}   # alpha overridden by run.roughness below
  fix: bottom

coordination:
  cn_distr:
    Al: {6: 0.2}            # ~20% of Al grown at CN 6, the rest at the default CN 4

calculators:
  growth:     {type: lammps, dump_path: dump_lmp}
  # CPU MACE: float64 by default on CPU (accurate for geometry optimisation). The model is
  # loaded once per process; with --workers 1 that is once per node.
  saturation: {type: mace, mace_model_path: your_model.model, device: cpu, dump_path: dump_mace}

saturation:        {enabled: true}
charge_correction: {enabled: true}

run:
  seeds: [0, 1, 2, 3]
  roughness: [0.01, 0.1, 1.0]       # 4 seeds x 3 roughnesses = 12 structures across the array
  output_dir: output/siral70_mace_cpu
  output_format: vasp
