# Scenario 1 -- CPU-only LAMMPS/BKS, generated in parallel.
#
# A plain SiO2 sweep (8 seeds x 2 roughnesses = 16 structures). On HPC this runs as a job
# array, each task taking a shard and running it across an in-node pool of single-threaded
# workers:
#
#   python -m runner examples/config/scenario1_lammps_cpu.yaml \
#       --num-shards N --shard $SLURM_ARRAY_TASK_ID --workers $CORES --threads 1
#   python -m runner examples/config/scenario1_lammps_cpu.yaml --pool-only   # after the array
#
# See examples/slurm/scenario1_lammps_cpu.sbatch.

structure:
  cell: [22.0, 22.0, 40.0]

composition:
  target_ratios: {Si: 1, O: 2}
  target_number_atoms: 300

limits:
  bottom: {type: flat,    z: 12.0}
  top:    {type: fourier, z_av: 24.0, alpha: 1.0}   # alpha overridden by run.roughness
  fix: bottom

calculators:
  growth: {type: lammps, dump_path: dump_lmp}

run:
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  roughness: [0.1, 1.0]            # 8 seeds x 2 = 16 structures across the array
  output_dir: output/scenario1_lammps_cpu
  output_format: vasp
